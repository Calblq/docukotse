name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cardocs
          POSTGRES_PASSWORD: cardocs
          POSTGRES_DB: cardocs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cardocs"
          --health-interval 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cardocs:cardocs@localhost:5432/cardocs_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng tesseract-ocr-fil tesseract-ocr-osd
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../scripts ../eval
          ruff format --check . ../scripts ../eval
      - name: Test
        # Storage, embeddings, reranker and LLM are faked; Postgres and Tesseract are real.
        run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: UI tests (API mocked)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
